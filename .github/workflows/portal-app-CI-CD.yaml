name: DevSecOps Ci/CD Pipeline

on: 
  push:
    branches:
      - "master"

jobs:
  portal-app-CI-CD:
    name: DevSecOps Ci/CD Pipeline
    runs-on: ubuntu-latest

    ### GIT code Checkout 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

    ### Installing Nodejs 16
      - name: Setup Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'

    ### Installing Java JDK17 (Required for SonarQube)
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

     ### Installing Trivy
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin


    ### Configuring AWS CLI access.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

############################ Pre Build Phase ###################################
    
      - name: 🔍 Dependency Vulnerability Scan (Node.js)
        run: |
          trivy fs --scan-type library ./app-Frontend --exit-code 1 --severity HIGH,CRITICAL .

      - name: 🔐 Secrets & FileSystem Vulnerability Scan
        run: |
          trivy fs --scanners secret,vuln --exit-code 0 .



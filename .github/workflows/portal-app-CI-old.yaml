# .github/workflows/build.yml
name: Portal-app-CI

on:
  push:
    branches: [ "master" ]
  # pull_request:
  #   branches: [ "master" ]
# on: 
#  workflow_call:

jobs:
  build:
    # runs-on: self-hosted
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Portal-app-Build
        run: | 
          cd app-Frontend
          npm init -y
          npm i express.js body-parser knex pg nodemon

      - name: Downloading portal-app.js from AWS
        run: |
          aws s3 cp s3://portal-spontansolutions/secrets/portal-app.js app-Frontend/
          
      - name: Creating Artifact
        run: |
          cd app-Frontend
          tar -czf portal-spontan-github-action.tar.gz node_modules package.json public portal-app.js

      - name: Uploading Artifact to S3 Bucket
        run: |
          cd app-Frontend
          aws s3 cp portal-spontan-github-action.tar.gz s3://portal-app-spontansolutions/github-actions/

      - name: Set up Docker
        uses: docker/setup-docker-action@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ vars.DOCKERHUB_PASSWORD }}

      - name: Create Docker Image and Tag
        run: |
          cd app-Frontend
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/portal-spontan-github-action:V1 .

      - name: Docker Image Push
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/portal-spontan-github-action:V1
        



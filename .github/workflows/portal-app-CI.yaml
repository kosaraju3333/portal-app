# .github/workflows/build.yml
name: Portal-app-Build

on:
  push:
    branches: [ "master" ]
  # pull_request:
  #   branches: [ "master" ]
# on: 
#  workflow_call:

jobs:
  build:
    runs-on: self-hosted
    #runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Portal-app-Build
        run: | 
          npm init -y
          npm i express.js body-parser knex pg nodemon

      - name: Downloading portal-app.js from AWS
        run: |
          aws s3 cp s3://portal-spontansolutions/secrets/portal-app.js .
          
      - name: Creating Artifact
        run: |
          tar -czf portal-spontan-github-action.tar.gz node_modules package.json public portal-app.js



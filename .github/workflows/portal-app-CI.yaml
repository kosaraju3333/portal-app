name: Build and Push Docker image of  portal-app to Docker Hub

on: 
  push:
    branches:
      - "master"

jobs:
  portal-app-CI:
    name: Build and push portal-app image to DOCKER HUB
    runs-on: ubuntu-latest

    ### GIT code Checkout 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

    ### Installing Nodejs 16
      - name: Setup Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'

    ### Installing Java JDK17 (Required for SonarQube)
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

    ### Configuring AWS CLI access.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


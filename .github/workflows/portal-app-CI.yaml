      # - name: Run Trivy Scan on Local Docker Image
      #   run: |
      #     echo "1234"
      #     docker images
      #     echo "5678"
      #     trivy image --severity HIGH,CRITICAL portal-app:latest
        # trivy image --severity HIGH,CRITICAL portal-app:${{ env.DATE }}

      # - name: Tag Docker Image
      #   run: |
      #     docker tag portal-app:${{ env.DATE }} ${{ secrets.DOCKERHUB_USERNAME }}/portal-app:${{ env.DATE }}


    ### Push to Docker Hub
      - name: Push Portal-app to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: app-Frontend
          dockerfile: Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/portal-app:${{ env.DATE }}

  ### Docker Image Scan by Trivy
      - name: Run Trivy Docker Image Scan (Docker Image Scan)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'image'
          scan-ref: ${{ secrets.DOCKERHUB_USERNAME }}/portal-app:${{ env.DATE }}
          ignore-unfixed: true
          format: 'table'
          exit-code: 1
          severity: 'CRITICAL,HIGH'



